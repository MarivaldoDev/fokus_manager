[project]
name = "training-tests"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-storage-blob>=12.28.0",
    "celery>=5.6.3",
    "colorlog>=6.10.1",
    "coverage>=7.13.2",
    "dj-database-url>=3.1.2",
    "django>=6.0.1",
    "django-autoslug>=1.9.9",
    "django-celery-beat>=2.9.0",
    "django-celery-results>=2.6.0",
    "django-cleanup>=9.0.0",
    "django-silk>=5.5.0",
    "django-storages>=1.14.6",
    "django-stubs>=6.0.6",
    "django-stubs-ext>=6.0.6",
    "flower>=2.0.1",
    "gunicorn>=26.0.0",
    "hashids>=1.3.1",
    "mypy>=2.1.0",
    "parameterized>=0.9.0",
    "pillow>=12.1.0",
    "pre-commit>=4.5.1",
    "psycopg>=3.3.4",
    "psycopg2-binary>=2.9.12",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "python-decouple>=3.8",
    "redis>=8.0.0",
    "selenium>=4.41.0",
    "webdriver-manager>=4.0.2",
    "whitenoise>=6.12.0",
]

[tool.ruff]
line-length=120
exclude = ['./tasks/migrations', './authors/migrations']

[tool.ruff.lint]
select = ['I', 'F', 'E', 'W', 'PL', 'PT']
ignore = ['PT009', 'PLR2004']
